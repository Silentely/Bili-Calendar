<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f0dd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)" />
    <title>Bili-Calendar 运维面板</title>
    <link rel="stylesheet" href="/admin/metrics.css" />
  </head>
  <body>
    <!-- 像素风场景：纯装饰图层，对辅助技术隐藏且不接收指针事件 -->
    <div class="retro-scene" aria-hidden="true">
      <svg class="scene-cloud" viewBox="0 0 40 20">
        <path fill="#afcfc0" d="M14 3h11v3h5v4h5v3h4v5H2v-5h4v-3h4V6h4z" />
        <path fill="#d9e7d4" d="M14 3h8v3h-8zM10 7h17v4H6v-1h4zM3 13h30v3H3z" />
      </svg>
    </div>

    <div class="page">
      <header class="topbar">
        <div>
          <div class="title">Bili-Calendar Metrics</div>
          <div class="subtitle">实时查看请求与限流指标（仅本地内存，不持久化）</div>
        </div>
        <button id="refreshBtn">手动刷新</button>
      </header>

      <section class="cards" id="summary"></section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">请求统计</div>
        </div>
        <div id="requestChart" class="chart"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">B站 API 延迟 (ms)</div>
        </div>
        <div id="apiChart" class="chart"></div>
      </section>

      <footer class="footer">数据来源 /status?format=json · 页面每 5s 自动刷新</footer>
    </div>

    <script src="/admin/metrics.js" defer></script>
  </body>
</html>
